<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Instant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&family=Indie+Flower&family=Oooh+Baby&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a1a;
      --surface: #242424;
      --border: #333;
      --text: #f0f0f0;
      --muted: #888;
      --accent: #fff;
      --radius: 16px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 24px 12px;
      gap: 10px;
    }

    header h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    header .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.7;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 16px 32px;
      gap: 20px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Upload zone ── */
    #upload-zone {
      width: 100%;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      text-align: center;
    }
    #upload-zone.drag-over {
      border-color: #fff;
      background: rgba(255,255,255,0.04);
    }
    #upload-zone svg { opacity: 0.5; }
    #upload-zone p { color: var(--muted); font-size: 15px; line-height: 1.5; }
    #upload-zone strong { color: var(--text); }
    #file-input { display: none; }

    /* ── Step panels ── */
    .step {
      width: 100%;
      display: none;
      flex-direction: column;
      gap: 16px;
    }
    .step.active { display: flex; }

    .step-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Crop stage ── */
    #crop-container {
      width: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
      touch-action: none;
      cursor: grab;
      user-select: none;
    }
    #crop-container:active { cursor: grabbing; }
    #crop-img {
      display: block;
      width: 100%;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    #crop-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    /* dark mask outside crop area */
    #crop-mask {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .crop-frame {
      position: absolute;
      border: 2px solid rgba(255,255,255,0.9);
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.55);
      pointer-events: none;
    }
    .crop-hint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      white-space: nowrap;
      pointer-events: none;
    }

    /* zoom slider */
    .zoom-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .zoom-row svg { flex-shrink: 0; opacity: 0.6; }
    input[type=range] {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    /* ── Text input ── */
    #caption-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-family: 'Indie Flower', cursive;
      font-size: 22px;
      line-height: 1.3;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      min-height: 70px;
    }
    #caption-input::placeholder { color: var(--muted); }
    #caption-input:focus { border-color: rgba(255,255,255,0.4); }

    /* font picker */
    .font-row {
      display: flex;
      gap: 8px;
    }
    .font-btn {
      flex: 1;
      padding: 10px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 17px;
      transition: border-color 0.15s, background 0.15s;
      text-align: center;
    }
    .font-btn.active {
      border-color: #fff;
      background: rgba(255,255,255,0.08);
    }
    .font-btn[data-font="Rock Salt"]    { font-family: 'Rock Salt', cursive; font-size: 13px; }
    .font-btn[data-font="Indie Flower"] { font-family: 'Indie Flower', cursive; }
    .font-btn[data-font="Oooh Baby"]    { font-family: 'Oooh Baby', cursive; }

    .size-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .size-row .sz-label {
      color: var(--muted);
      font-weight: 600;
      flex-shrink: 0;
      line-height: 1;
      user-select: none;
    }
    .size-row .sz-label.sm { font-size: 13px; }
    .size-row .sz-label.lg { font-size: 22px; }

    /* ── Preview ── */
    #preview-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    #preview-canvas {
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1 / 1;
      border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      display: block;
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .btn {
      flex: 1;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: -0.2px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: #fff;
      color: #000;
    }
    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Save success ── */
    #save-feedback {
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      min-height: 20px;
    }

    @media (min-width: 500px) {
      header h1 { font-size: 26px; }
    }
  </style>
</head>
<body>

<header>
  <h1>Instant</h1>
</header>

<main>

  <!-- Step 0: Upload -->
  <div id="upload-zone" role="button" tabindex="0" aria-label="Upload photo">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <p><strong>Tap to choose a photo</strong><br/>drag &amp; drop here</p>
    <input type="file" id="file-input" accept="image/*" />
  </div>

  <!-- Step 1: Crop -->
  <div class="step" id="step-crop">
    <span class="step-label">1 — Crop</span>
    <div id="crop-container">
      <img id="crop-img" alt="Photo to crop" draggable="false" />
      <div class="crop-frame" id="crop-frame"></div>
      <div class="crop-hint">Drag to reposition · Pinch or slider to zoom</div>
    </div>
    <div class="zoom-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      <input type="range" id="zoom-slider" min="100" max="300" value="100" step="1" />
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="btn-back-upload">Change photo</button>
      <button class="btn btn-primary" id="btn-apply-crop">Apply crop →</button>
    </div>
  </div>

  <!-- Step 2: Caption & Preview -->
  <div class="step" id="step-caption">
    <span class="step-label">2 — Write</span>
    <div class="font-row">
      <button class="font-btn" data-font="Rock Salt">Rock Salt</button>
      <button class="font-btn active" data-font="Indie Flower">Indie Flower</button>
      <button class="font-btn" data-font="Oooh Baby">Oooh Baby</button>
    </div>
    <textarea id="caption-input" rows="2" placeholder="Write something…" maxlength="120"></textarea>
    <div class="size-row">
      <span class="sz-label sm">A</span>
      <input type="range" id="font-size-slider" min="40" max="180" value="100" step="10" />
      <span class="sz-label lg">A</span>
      <span id="font-size-value" style="min-width:36px;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums">100</span>
    </div>

    <span class="step-label" style="margin-top:4px">Preview</span>
    <div id="preview-wrap">
      <canvas id="preview-canvas"></canvas>
    </div>

    <div class="btn-row">
      <button class="btn btn-ghost" id="btn-back-crop">← Back</button>
      <button class="btn btn-primary" id="btn-save">Save photo</button>
    </div>
    <div id="save-feedback"></div>
  </div>

</main>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
const CROP_RATIO = 5 / 4; // width / height (landscape)

let originalImage  = null; // HTMLImageElement — used for layout/display only
let originalBitmap = null; // ImageBitmap created with colorSpaceConversion:'none' — used for all canvas draws to preserve HDR/P3
let cropState = {
  zoom: 1,        // scale factor (1 = fit)
  offsetX: 0,    // px offset of image centre from frame centre
  offsetY: 0,
};
let croppedBitmap = null; // ImageBitmap of cropped 5:4 region
let selectedFont = 'Indie Flower';
let fontSizeScale = 100; // percentage, 40–180

// ─── DOM refs ─────────────────────────────────────────────────────────────────
const uploadZone     = document.getElementById('upload-zone');
const fileInput      = document.getElementById('file-input');
const stepCrop       = document.getElementById('step-crop');
const stepCaption    = document.getElementById('step-caption');
const cropContainer  = document.getElementById('crop-container');
const cropImg        = document.getElementById('crop-img');
const cropFrame      = document.getElementById('crop-frame');
const zoomSlider     = document.getElementById('zoom-slider');
const btnBackUpload  = document.getElementById('btn-back-upload');
const btnApplyCrop   = document.getElementById('btn-apply-crop');
const captionInput   = document.getElementById('caption-input');
const previewCanvas  = document.getElementById('preview-canvas');
const btnBackCrop    = document.getElementById('btn-back-crop');
const btnSave        = document.getElementById('btn-save');
const saveFeedback   = document.getElementById('save-feedback');

// ─── Upload ───────────────────────────────────────────────────────────────────
uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); });
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadImage(e.target.files[0]); });

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
});

function loadImage(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = async () => {
    originalImage  = img;
    // Decode the raw file bytes without any colour-space conversion so that
    // P3 / HDR values are preserved when drawn to our display-p3 canvases.
    try {
      originalBitmap = await createImageBitmap(file, {
        colorSpaceConversion: 'none',
        premultiplyAlpha: 'none',
      });
    } catch {
      originalBitmap = null; // older Safari — fall back to <img>
    }
    initCrop();
    showStep('crop');
  };
  img.src = url;
}

// ─── Crop ─────────────────────────────────────────────────────────────────────
function showStep(name) {
  uploadZone.style.display  = name === 'upload'   ? '' : 'none';
  stepCrop.classList.toggle('active',    name === 'crop');
  stepCaption.classList.toggle('active', name === 'caption');
}

function initCrop() {
  cropImg.src = originalImage.src;
  cropState = { zoom: 1, offsetX: 0, offsetY: 0 };
  zoomSlider.value = 100;
  requestAnimationFrame(layoutCrop);
}

// Lay out the crop UI: size the container, position the image, draw the frame
function layoutCrop() {
  const containerW = cropContainer.clientWidth || 360;

  // The visible crop frame takes up most of the container width (we leave some padding)
  const frameW = containerW;
  const frameH = frameW / CROP_RATIO;

  // Container is exactly the frame size (full bleed — image pokes out)
  cropContainer.style.height = frameH + 'px';

  // Frame overlay (covers full container since it IS the frame here)
  cropFrame.style.left   = '0px';
  cropFrame.style.top    = '0px';
  cropFrame.style.width  = frameW + 'px';
  cropFrame.style.height = frameH + 'px';

  positionImage();
}

function positionImage() {
  const containerW = cropContainer.clientWidth;
  const containerH = cropContainer.clientHeight;
  const img = originalImage;

  // Fit scale = smallest scale so image fills frame
  const scaleX = containerW / img.naturalWidth;
  const scaleY = containerH / img.naturalHeight;
  const fitScale = Math.max(scaleX, scaleY);

  const scale = fitScale * (cropState.zoom);

  const imgW = img.naturalWidth  * scale;
  const imgH = img.naturalHeight * scale;

  // Clamp offsets so image always covers the frame
  const maxOffX = (imgW - containerW) / 2;
  const maxOffY = (imgH - containerH) / 2;
  cropState.offsetX = clamp(cropState.offsetX, -maxOffX, maxOffX);
  cropState.offsetY = clamp(cropState.offsetY, -maxOffY, maxOffY);

  const left = (containerW - imgW) / 2 + cropState.offsetX;
  const top  = (containerH - imgH) / 2 + cropState.offsetY;

  cropImg.style.position = 'absolute';
  cropImg.style.width    = imgW + 'px';
  cropImg.style.height   = imgH + 'px';
  cropImg.style.left     = left + 'px';
  cropImg.style.top      = top  + 'px';
}

function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }

// Drag (pointer)
let dragging = false, lastX = 0, lastY = 0;

cropContainer.addEventListener('pointerdown', e => {
  dragging = true;
  lastX = e.clientX; lastY = e.clientY;
  cropContainer.setPointerCapture(e.pointerId);
});
cropContainer.addEventListener('pointermove', e => {
  if (!dragging) return;
  cropState.offsetX += e.clientX - lastX;
  cropState.offsetY += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  positionImage();
});
cropContainer.addEventListener('pointerup',   () => { dragging = false; });
cropContainer.addEventListener('pointercancel', () => { dragging = false; });

// Pinch-to-zoom
let lastPinchDist = null;
cropContainer.addEventListener('touchstart', e => {
  if (e.touches.length === 2) lastPinchDist = pinchDist(e.touches);
}, { passive: true });
cropContainer.addEventListener('touchmove', e => {
  if (e.touches.length !== 2) return;
  const d = pinchDist(e.touches);
  if (lastPinchDist) {
    const ratio = d / lastPinchDist;
    const newZoom = clamp(cropState.zoom * ratio, 1, 3);
    cropState.zoom = newZoom;
    zoomSlider.value = Math.round(newZoom * 100);
    positionImage();
  }
  lastPinchDist = d;
}, { passive: true });
cropContainer.addEventListener('touchend', () => { lastPinchDist = null; }, { passive: true });

function pinchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}

// Zoom slider
zoomSlider.addEventListener('input', () => {
  cropState.zoom = zoomSlider.value / 100;
  positionImage();
});

window.addEventListener('resize', () => {
  if (stepCrop.classList.contains('active')) layoutCrop();
});

// ─── Apply crop → get croppedBitmap ───────────────────────────────────────────
btnApplyCrop.addEventListener('click', async () => {
  croppedBitmap = extractCrop();
  showStep('caption');
  await renderPreview();
});

function extractCrop() {
  const containerW = cropContainer.clientWidth;
  const containerH = cropContainer.clientHeight;
  const img = originalImage;

  const scaleX = containerW / img.naturalWidth;
  const scaleY = containerH / img.naturalHeight;
  const fitScale = Math.max(scaleX, scaleY);
  const scale = fitScale * cropState.zoom;

  const imgW = img.naturalWidth  * scale;
  const imgH = img.naturalHeight * scale;
  const left = (containerW - imgW) / 2 + cropState.offsetX;
  const top  = (containerH - imgH) / 2 + cropState.offsetY;

  // Source rect in original image coords
  const srcX = -left / scale;
  const srcY = -top  / scale;
  const srcW = containerW / scale;
  const srcH = containerH / scale;

  // Render into an offscreen canvas at 2× for crispness
  const DPR = 2;
  const outW = Math.round(containerW * DPR);
  const outH = Math.round(containerH * DPR);
  const oc = new OffscreenCanvas(outW, outH);
  const ctx = oc.getContext('2d', { colorSpace: 'display-p3' }) || oc.getContext('2d');
  // Prefer originalBitmap (raw, no colour conversion) over the <img> element
  ctx.drawImage(originalBitmap || img, srcX, srcY, srcW, srcH, 0, 0, outW, outH);
  return oc; // treat as ImageSource
}

// ─── Preview (Photo canvas) ────────────────────────────────────────────────
btnBackCrop.addEventListener('click', () => {
  showStep('crop');
  layoutCrop();
});
btnBackUpload.addEventListener('click', () => {
  showStep('upload');
  uploadZone.style.display = '';
  fileInput.value = '';
  originalBitmap = null;
});

captionInput.addEventListener('input', renderPreview);

const fontSizeSlider = document.getElementById('font-size-slider');
const fontSizeValue  = document.getElementById('font-size-value');

fontSizeSlider.addEventListener('input', e => {
  fontSizeScale = Number(e.target.value);
  fontSizeValue.textContent = fontSizeScale;
  renderPreview();
});

document.querySelectorAll('.font-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedFont = btn.dataset.font;
    captionInput.style.fontFamily = `'${selectedFont}', cursive`;
    fontSizeScale = 100;
    fontSizeSlider.value = 100;
    fontSizeValue.textContent = 100;
    renderPreview();
  });
});

async function renderPreview() {
  if (!croppedBitmap) return;

  const canvas = previewCanvas;
  // Square total canvas: N×N
  // side borders = 10% of N, top = 10% of N, bottom = 26% of N
  // → photo = 80% wide × 64% tall = 5:4 ratio, no stretching
  const N          = 1000;
  const borderSide = Math.round(N * 0.10);
  const borderTop  = Math.round(N * 0.10);
  const borderBot  = Math.round(N * 0.26);
  const photoW     = N - borderSide * 2;  // 800
  const photoH     = N - borderTop - borderBot; // 640  (800/640 = 5/4)
  const totalW     = N;
  const totalH     = N;

  // CSS aspect-ratio:1 handles display sizing; we only set buffer resolution
  const DPR = window.devicePixelRatio || 2;
  canvas.width  = N * DPR;
  canvas.height = N * DPR;

  const ctx = canvas.getContext('2d', { colorSpace: 'display-p3' }) || canvas.getContext('2d');
  ctx.scale(DPR, DPR);

  // White Photo background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, totalW, totalH);

  // Subtle shadow inside border for depth (optional)
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.08)';
  ctx.shadowBlur  = 6;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 2;
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(borderSide, borderTop, photoW, photoH);
  ctx.restore();

  // Draw the cropped photo
  ctx.drawImage(croppedBitmap, borderSide, borderTop, photoW, photoH);

  // Caption text
  const text = captionInput.value.trim();
  if (text) {
    const fontSize = Math.round(borderBot * 0.48 * (fontSizeScale / 100));
    ctx.font = `${fontSize}px '${selectedFont}', cursive`;
    ctx.fillStyle = '#111';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Word-wrap into bottom border area
    const maxWidth = totalW - borderSide * 2;
    const lineH    = fontSize * 1.25;
    const lines    = wrapText(ctx, text, maxWidth);
    const textAreaCenterY = photoH + borderTop + borderBot / 2;
    const totalTextH = lines.length * lineH;
    let startY = textAreaCenterY - (totalTextH - lineH) / 2;

    lines.forEach((line, i) => {
      ctx.fillText(line, totalW / 2, startY + i * lineH);
    });
  }
}

function wrapText(ctx, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let current = '';
  for (const word of words) {
    const test = current ? current + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && current) {
      lines.push(current);
      current = word;
    } else {
      current = test;
    }
  }
  if (current) lines.push(current);
  return lines.slice(0, 3); // max 3 lines
}

// ─── Save ─────────────────────────────────────────────────────────────────────
btnSave.addEventListener('click', saveImage);

async function saveImage() {
  btnSave.disabled = true;
  saveFeedback.textContent = '';

  try {
    // Render a high-res version (3× for print quality)
    const HQ = await renderHighRes();

    // JPEG preserves the Display P3 color profile in Exif on iOS Safari
    const mime = 'image/jpeg';
    const quality = 0.96;

    // iOS Safari: use share sheet so the file lands directly in Photos
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    if (isIOS && navigator.share) {
      HQ.toBlob(async blob => {
        try {
          const file = new File([blob], 'instant.jpg', { type: mime });
          await navigator.share({ files: [file], title: 'Instant photo' });
          saveFeedback.textContent = 'Shared!';
        } catch {
          downloadBlob(blob, 'instant.jpg');
        }
        btnSave.disabled = false;
      }, mime, quality);
    } else {
      HQ.toBlob(blob => {
        downloadBlob(blob, 'instant.jpg');
        saveFeedback.textContent = 'Saved!';
        btnSave.disabled = false;
      }, mime, quality);
    }
  } catch (err) {
    console.error(err);
    saveFeedback.textContent = 'Could not save. Try again.';
    btnSave.disabled = false;
  }
}

async function renderHighRes() {
  // Square output: N×N — same proportions as preview
  const N          = 3000;
  const borderSide = Math.round(N * 0.10);
  const borderTop  = Math.round(N * 0.10);
  const borderBot  = Math.round(N * 0.26);
  const photoW     = N - borderSide * 2;  // 2400
  const photoH     = N - borderTop - borderBot; // 1920  (2400/1920 = 5/4)
  const totalW     = N;
  const totalH     = N;

  const oc  = new OffscreenCanvas(totalW, totalH);
  const ctx = oc.getContext('2d', { colorSpace: 'display-p3' }) ||
              oc.getContext('2d'); // fallback for non-p3 browsers

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, totalW, totalH);

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.08)';
  ctx.shadowBlur  = 18;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 6;
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(borderSide, borderTop, photoW, photoH);
  ctx.restore();

  ctx.drawImage(croppedBitmap, borderSide, borderTop, photoW, photoH);

  const text = captionInput.value.trim();
  if (text) {
    const fontSize = Math.round(borderBot * 0.48 * (fontSizeScale / 100));
    ctx.font = `${fontSize}px '${selectedFont}', cursive`;
    ctx.fillStyle = '#111';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const maxWidth = totalW - borderSide * 2;
    const lineH    = fontSize * 1.25;
    const lines    = wrapText(ctx, text, maxWidth);
    const textAreaCenterY = photoH + borderTop + borderBot / 2;
    const totalTextH = lines.length * lineH;
    let startY = textAreaCenterY - (totalTextH - lineH) / 2;
    lines.forEach((line, i) => {
      ctx.fillText(line, totalW / 2, startY + i * lineH);
    });
  }

  // Convert OffscreenCanvas → regular canvas for toBlob support (keep P3 color space)
  const out = document.createElement('canvas');
  out.width  = totalW;
  out.height = totalH;
  const octx = out.getContext('2d', { colorSpace: 'display-p3' }) || out.getContext('2d');
  octx.drawImage(oc, 0, 0);
  return out;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a   = document.createElement('a');
  a.href     = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// ─── Favicon ──────────────────────────────────────────────────────────────────
(function () {
  // 512px canvas — iOS scales it down and applies the squircle mask itself
  const S = 512;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');

  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y,     x + w, y + r,     r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x,     y + h, x,     y + h - r, r);
    ctx.lineTo(x,     y + r);
    ctx.arcTo(x,     y,     x + r, y,         r);
    ctx.closePath();
  }

  // ── Background: fill the entire square (iOS clips to squircle) ──
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, S, S);

  // ── Polaroid card ──
  // Leave ~9% margin each side so the card doesn't touch the squircle edge
  const margin = Math.round(S * 0.09); // 46px
  const cw = S - margin * 2;           // 420px wide
  const cx = margin;

  // Card proportions: 10% border sides/top, 26% border bottom (same as app)
  const bSide = Math.round(cw * 0.10);
  const bTop  = Math.round(cw * 0.10);
  const bBot  = Math.round(cw * 0.26);
  const pw    = cw - bSide * 2;              // photo width
  const ph    = Math.round(pw * 4 / 5);      // photo height (5:4 → h = w×0.8)
  const ch    = bTop + ph + bBot;            // card height
  const cy    = Math.round((S - ch) / 2);   // vertically centred

  // Card shadow
  ctx.shadowColor = 'rgba(0,0,0,0.18)';
  ctx.shadowBlur  = 30;
  ctx.shadowOffsetY = 8;
  rrect(cx, cy, cw, ch, 16);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.shadowColor = 'transparent';

  // ── Photo area ──
  const ppx = cx + bSide, ppy = cy + bTop;
  rrect(ppx, ppy, pw, ph, 4);
  ctx.save();
  ctx.clip();

  // Sky gradient
  const sky = ctx.createLinearGradient(0, ppy, 0, ppy + ph);
  sky.addColorStop(0,    '#cce8f8');
  sky.addColorStop(0.55, '#5aaaea');
  sky.addColorStop(1,    '#3a7ec8');
  ctx.fillStyle = sky;
  ctx.fillRect(ppx, ppy, pw, ph);

  // Sun
  ctx.fillStyle = '#FFD060';
  ctx.beginPath();
  ctx.arc(ppx + pw * 0.78, ppy + ph * 0.22, pw * 0.09, 0, Math.PI * 2);
  ctx.fill();

  // Hills
  ctx.fillStyle = 'rgba(60, 140, 60, 0.88)';
  ctx.beginPath();
  ctx.moveTo(ppx, ppy + ph);
  ctx.quadraticCurveTo(ppx + pw * 0.22, ppy + ph * 0.60, ppx + pw * 0.44, ppy + ph * 0.76);
  ctx.quadraticCurveTo(ppx + pw * 0.66, ppy + ph * 0.92, ppx + pw, ppy + ph * 0.66);
  ctx.lineTo(ppx + pw, ppy + ph);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  // Subtle card border
  rrect(cx, cy, cw, ch, 16);
  ctx.strokeStyle = 'rgba(0,0,0,0.06)';
  ctx.lineWidth = 2;
  ctx.stroke();

  const dataURL = c.toDataURL('image/png');
  ['icon', 'apple-touch-icon'].forEach(rel => {
    const l = document.createElement('link');
    l.rel  = rel;
    l.href = dataURL;
    document.head.appendChild(l);
  });
})();
</script>
