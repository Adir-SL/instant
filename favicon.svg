<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Sky gradient spans the photo rect (74,74)→(438,365) -->
    <linearGradient id="sky" x1="74" y1="74" x2="74" y2="365" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#cce8f8"/>
      <stop offset="55%"  stop-color="#5aaaea"/>
      <stop offset="100%" stop-color="#3a7ec8"/>
    </linearGradient>

    <!-- Clip photo contents to the photo rect -->
    <clipPath id="pc">
      <rect x="74" y="74" width="364" height="291" rx="4"/>
    </clipPath>
  </defs>

  <!-- White icon background (iOS applies squircle mask itself) -->
  <rect width="512" height="512" fill="#fff"/>

  <!-- Polaroid card -->
  <rect x="46" y="46" width="420" height="420" rx="16" fill="#fff" filter="url(#sh)"/>

  <!-- Photo area contents, clipped -->
  <g clip-path="url(#pc)">
    <rect x="74" y="74" width="364" height="291" fill="url(#sky)"/>
    <circle cx="358" cy="138" r="33" fill="#FFD060"/>
    <path d="M74 365 Q154 249 234 295 Q314 342 438 266 L438 365 Z"
          fill="#3c8c3c" opacity="0.88"/>
  </g>

  <!-- Subtle card border on top -->
  <rect x="46" y="46" width="420" height="420" rx="16"
        fill="none" stroke-opacity="0.06" stroke-width="2"/>
</svg>
