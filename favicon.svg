<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Sky gradient in user-space coords so it spans the photo rect exactly -->
    <linearGradient id="sky" x1="88" y1="88" x2="88" y2="357" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#cce8f8"/>
      <stop offset="55%"  stop-color="#5aaaea"/>
      <stop offset="100%" stop-color="#3a7ec8"/>
    </linearGradient>

    <!-- Clip photo contents to the photo rect -->
    <clipPath id="pc">
      <rect x="88" y="88" width="336" height="269" rx="4"/>
    </clipPath>
  </defs>

  <!-- White icon background (iOS applies squircle mask itself) -->
  <rect width="512" height="512" fill="#fff"/>

  <!-- Polaroid card -->
  <rect x="46" y="46" width="420" height="420" rx="16" fill="#fff" filter="url(#sh)"/>

  <!-- Photo area contents, clipped -->
  <g clip-path="url(#pc)">
    <rect x="88" y="88" width="336" height="269" fill="url(#sky)"/>
    <circle cx="350" cy="147" r="30" fill="#FFD060"/>
    <path d="M88 357 Q162 249 236 292 Q310 336 424 266 L424 357 Z"
          fill="#3c8c3c" opacity="0.88"/>
  </g>

  <!-- Subtle card border on top -->
  <rect x="46" y="46" width="420" height="420" rx="16"
        fill="none" stroke-opacity="0.06" stroke-width="2"/>
</svg>
